<!DOCTYPE html>
<html>
<head>
    <title>Sales Prediction</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            background: white;
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background: #4facfe;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #007bff;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📊 Sales Prediction</h1>

        <input type="number" id="tv" placeholder="TV Budget">
        <input type="number" id="radio" placeholder="Radio Budget">
        <input type="number" id="news" placeholder="Newspaper Budget">

        <br>

        <button onclick="predict()">Predict Sales</button>

        <div id="result"></div>

    </div>

    <script>
        function predict() {

            let tv = document.getElementById("tv").value;
            let radio = document.getElementById("radio").value;
            let news = document.getElementById("news").value;

            // simple formula (demo purpose)
            let sales = (0.05 * tv) + (0.1 * radio) + (0.02 * news);

            document.getElementById("result").innerHTML =
                "📈 Predicted Sales: " + sales.toFixed(2);
        }
    </script>

</body>
</html>
