<!DOCTYPE html>
<html>
<head>
    <title>Sales Prediction</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 500px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: #4facfe;
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 10px;
        }

        button:hover {
            background: #007bff;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📊 Sales Prediction</h1>

        <input type="number" id="tv" placeholder="TV Budget">
        <input type="number" id="radio" placeholder="Radio Budget">
        <input type="number" id="news" placeholder="Newspaper Budget">

        <br>

        <button onclick="predict()">Predict Sales</button>

        <div id="result"></div>

    </div>

    <script>
        function predict() {

            let tv = document.getElementById("tv").value;
            let radio = document.getElementById("radio").value;
            let news = document.getElementById("news").value;

            // Simple prediction formula (demo)
            let sales = (0.05 * tv) + (0.1 * radio) + (0.02 * news);

            document.getElementById("result").innerHTML =
                "📈 Predicted Sales: " + sales.toFixed(2);
        }
    </script>

</body>
</html>
